<script>
(function () {
  'use strict';
  var toggle = document.getElementById('mode-switch');
  var researchNav = document.querySelector('.visible-links:not(.visible-links--life)');
  var lifeNav = document.querySelector('.visible-links--life');
  var researchContent = document.querySelector('.mode-content--research');
  var lifeContent = document.querySelector('.mode-content--life');
  var lifeTabs = document.querySelectorAll('.life-tab');
  var nativeLifePage = document.body.getAttribute('data-life-page');
  var currentLifeTab = nativeLifePage || 'travel';

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.type !== 'gti-anatomy-height' || !Number.isFinite(data.height)) return;
    document.querySelectorAll('iframe.gti-anatomy').forEach(function (frame) {
      if (event.source === frame.contentWindow) frame.style.height = Math.max(420, Math.min(1800, data.height)) + 'px';
    });
  });

  function tabFromHash(hash) {
    var name = hash.substring(1);
    return name === 'travel' || name === 'gti-mark-8' ? name : null;
  }
  function sameDocument(url) {
    return url.origin === window.location.origin && url.pathname === window.location.pathname && url.search === window.location.search;
  }
  function showLifeTab(name) {
    currentLifeTab = name;
    if (researchContent) researchContent.style.display = nativeLifePage === name ? '' : 'none';
    if (lifeContent) lifeContent.style.display = nativeLifePage === name ? 'none' : '';
    lifeTabs.forEach(function (tab) {
      tab.style.display = tab.id === 'tab-' + name ? '' : 'none';
    });
    if (lifeNav) lifeNav.querySelectorAll('a').forEach(function (link) {
      var target = new URL(link.getAttribute('href'), window.location.href);
      if (target.hash === '#' + name) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }
  function setMode(isLife, tab) {
    if (toggle) toggle.checked = isLife;
    if (researchNav) researchNav.style.display = isLife ? 'none' : '';
    if (lifeNav) lifeNav.style.display = isLife ? '' : 'none';
    if (isLife) showLifeTab(tab || currentLifeTab);
    else {
      if (researchContent) researchContent.style.display = '';
      if (lifeContent) lifeContent.style.display = 'none';
    }
  }
  function syncLocation() {
    var tab = tabFromHash(window.location.hash);
    setMode(Boolean(tab || nativeLifePage), tab || nativeLifePage || currentLifeTab);
  }
  function updateHash(hash) {
    if (window.location.hash !== hash) window.history.pushState(null, '', hash || window.location.pathname + window.location.search);
  }
  syncLocation();
  // Same-page anchor changes do not reload scripts. Handle clicks, deep links,
  // and browser history consistently in both the site and file previews.
  window.addEventListener('hashchange', syncLocation);
  window.addEventListener('popstate', syncLocation);
  if (toggle) toggle.addEventListener('change', function () {
    setMode(toggle.checked);
    if (toggle.checked) updateHash('#' + currentLifeTab);
    else if (tabFromHash(window.location.hash)) updateHash('');
  });
  if (lifeNav) lifeNav.addEventListener('click', function (event) {
    var link = event.target.closest('a');
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    var target = new URL(link.getAttribute('href'), window.location.href);
    var tab = tabFromHash(target.hash);
    if (!tab || !sameDocument(target)) return;
    event.preventDefault();
    setMode(true, tab);
    updateHash(target.hash);
  });
  document.addEventListener('click', function (event) {
    var link = event.target.closest('.site-wordmark, .visible-links:not(.visible-links--life) a');
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    var target = new URL(link.getAttribute('href'), window.location.href);
    if (target.hash || !sameDocument(target)) return;
    event.preventDefault();
    setMode(false);
    updateHash('');
  });
})();
</script>
