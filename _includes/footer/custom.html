<script>
(function () {
  'use strict';
  var toggle = document.getElementById('mode-switch');
  var researchNav = document.querySelector('.visible-links:not(.visible-links--life)');
  var lifeNav = document.querySelector('.visible-links--life');
  var researchContent = document.querySelector('.mode-content--research');
  var lifeContent = document.querySelector('.mode-content--life');
  var lifeTabs = document.querySelectorAll('.life-tab');
  var nativeLifePage = document.body.getAttribute('data-life-page');
  var currentLifeTab = nativeLifePage || 'travel';

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.type !== 'gti-anatomy-height' || !Number.isFinite(data.height)) return;
    document.querySelectorAll('iframe.gti-anatomy').forEach(function (frame) {
      if (event.source === frame.contentWindow && event.origin === window.location.origin) {
        var requestedLimit = Number(frame.getAttribute('data-max-height')) || 1800;
        var limit = Math.max(1800, Math.min(3500, requestedLimit));
        frame.style.height = Math.max(420, Math.min(limit, data.height + 6)) + 'px';
      }
    });
  });

  function tabFromHash(hash) {
    var name = hash.substring(1);
    return name === 'travel' || name === 'gti-mark-8' ? name : null;
  }
  function sameDocument(url) {
    return url.origin === window.location.origin && url.pathname === window.location.pathname && url.search === window.location.search;
  }
  function showLifeTab(name) {
    currentLifeTab = name;
    if (researchContent) researchContent.style.display = nativeLifePage === name ? '' : 'none';
    if (lifeContent) lifeContent.style.display = nativeLifePage === name ? 'none' : '';
    lifeTabs.forEach(function (tab) {
      tab.style.display = tab.id === 'tab-' + name ? '' : 'none';
    });
    if (lifeNav) lifeNav.querySelectorAll('a').forEach(function (link) {
      var target = new URL(link.getAttribute('href'), window.location.href);
      if (target.hash === '#' + name) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }
  function setMode(isLife, tab) {
    if (toggle) toggle.checked = isLife;
    document.body.setAttribute('data-mode', isLife ? 'life' : 'research');
    if (researchNav) researchNav.style.display = isLife ? 'none' : '';
    if (lifeNav) lifeNav.style.display = isLife ? '' : 'none';
    if (isLife) showLifeTab(tab || currentLifeTab);
    else {
      if (researchContent) researchContent.style.display = '';
      if (lifeContent) lifeContent.style.display = 'none';
    }
  }
  // The lens change: the frame stays, the accent ink glides, a hairline sweeps
  // the masthead, and the content steps out of focus and back in.
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var stage = document.querySelector('.initial-content');
  var masthead = document.querySelector('.site-masthead');
  var toggleLabel = toggle ? toggle.closest('.mode-toggle') : null;
  var switching = null;
  function replay(element, className) {
    if (!element) return;
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
    window.setTimeout(function () { element.classList.remove(className); }, 800);
  }
  function lensSwitch(isLife, tab, done) {
    if (reduceMotion.matches || !stage || !stage.animate) {
      setMode(isLife, tab);
      if (done) done();
      return;
    }
    if (switching) switching.cancel();
    replay(toggleLabel, 'is-switching');
    replay(masthead, 'is-sweeping');
    var navs = [researchNav, lifeNav].filter(Boolean);
    switching = stage.animate(
      [{ opacity: 1, transform: 'none', filter: 'blur(0)' },
       { opacity: 0, transform: 'translateY(-4px)', filter: 'blur(3px)' }],
      { duration: 170, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' });
    navs.forEach(function (nav) {
      nav.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: 'forwards' });
    });
    switching.onfinish = function () {
      setMode(isLife, tab);
      if (done) done();
      if (window.scrollY > 0) window.scrollTo(0, 0);
      switching = stage.animate(
        [{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(3px)' },
         { opacity: 1, transform: 'none', filter: 'blur(0)' }],
        { duration: 440, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)', fill: 'forwards' });
      switching.onfinish = function () { switching.cancel(); switching = null; };
      navs.forEach(function (nav) {
        nav.getAnimations().forEach(function (a) { a.cancel(); });
        nav.animate(
          [{ opacity: 0, transform: 'translateX(' + (isLife ? '8px' : '-8px') + ')' },
           { opacity: 1, transform: 'none' }],
          { duration: 360, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)' });
      });
    };
  }
  function syncLocation() {
    var tab = tabFromHash(window.location.hash);
    setMode(Boolean(tab || nativeLifePage), tab || nativeLifePage || currentLifeTab);
  }
  function updateHash(hash) {
    if (window.location.hash !== hash) window.history.pushState(null, '', hash || window.location.pathname + window.location.search);
  }
  syncLocation();
  // Same-page anchor changes do not reload scripts. Handle clicks, deep links,
  // and browser history consistently in both the site and file previews.
  window.addEventListener('hashchange', syncLocation);
  window.addEventListener('popstate', syncLocation);
  if (toggle) toggle.addEventListener('change', function () {
    var isLife = toggle.checked;
    lensSwitch(isLife, null, function () {
      if (isLife) updateHash('#' + currentLifeTab);
      else if (tabFromHash(window.location.hash)) updateHash('');
    });
  });
  if (lifeNav) lifeNav.addEventListener('click', function (event) {
    var link = event.target.closest('a');
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    var target = new URL(link.getAttribute('href'), window.location.href);
    var tab = tabFromHash(target.hash);
    if (!tab || !sameDocument(target)) return;
    event.preventDefault();
    // Slide like a pager when moving between the Life tabs.
    var lifeLinks = Array.prototype.slice.call(lifeNav.querySelectorAll('a'));
    var fromIndex = lifeLinks.findIndex(function (item) { return item.getAttribute('aria-current') === 'page'; });
    var toIndex = lifeLinks.indexOf(link);
    var switchTab = function () { setMode(true, tab); };
    if (window.tabSlide && fromIndex >= 0 && toIndex !== fromIndex) window.tabSlide(toIndex > fromIndex ? 'forward' : 'back', switchTab);
    else switchTab();
    updateHash(target.hash);
  });
  document.addEventListener('click', function (event) {
    var link = event.target.closest('.site-wordmark, .visible-links:not(.visible-links--life) a');
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    var target = new URL(link.getAttribute('href'), window.location.href);
    if (target.hash || !sameDocument(target)) return;
    event.preventDefault();
    setMode(false);
    updateHash('');
  });
})();
</script>
