<!-- start custom head snippets -->

<link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
<link rel="stylesheet" href="{{ '/assets/css/tab-transitions.css' | relative_url }}">
<script src="{{ '/assets/js/tab-transitions.js' | relative_url }}"></script>

<!-- end custom head snippets -->

{% if page.translations %}
  {% for translation in page.translations %}
<link rel="alternate" hreflang="{{ translation[0] | escape }}" href="{{ translation[1] | absolute_url }}">
  {% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ page.translations['en'] | absolute_url }}">
{% endif %}
