<nav class="blog-series-nav" aria-label="Blog columns">
  <a href="{{ '/blog/' | relative_url }}"{% unless page.series %} aria-current="page"{% endunless %}>All articles</a>
  {% for entry in site.data.blog-series %}
    {% assign column = entry[1]['en'] %}
    <a href="{{ column.url | relative_url }}"{% if page.series == entry[0] %} aria-current="page"{% endif %}>{{ column.title | escape }}</a>
  {% endfor %}
</nav>
