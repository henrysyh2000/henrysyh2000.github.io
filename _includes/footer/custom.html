  <script>
    (function () {
      var toggle = document.getElementById('mode-switch');
      var researchNav = document.querySelector('.visible-links:not(.visible-links--life)');
      var lifeNav = document.querySelector('.visible-links--life');
      var researchContent = document.querySelector('.mode-content--research');
      var lifeContent = document.querySelector('.mode-content--life');
      var lifeTabs = document.querySelectorAll('.life-tab');

      function showLifeTab(name) {
        var tabId = 'tab-' + name;
        lifeTabs.forEach(function (tab) {
          tab.style.display = tab.id === tabId ? '' : 'none';
        });
      }

      function setMode(isLife) {
        toggle.checked = isLife;
        if (isLife) {
          if (researchNav) researchNav.style.display = 'none';
          if (lifeNav) lifeNav.style.display = '';
          if (researchContent) researchContent.style.display = 'none';
          if (lifeContent) lifeContent.style.display = '';
          showLifeTab('travel');
        } else {
          if (researchNav) researchNav.style.display = '';
          if (lifeNav) lifeNav.style.display = 'none';
          if (researchContent) researchContent.style.display = '';
          if (lifeContent) lifeContent.style.display = 'none';
        }
      }

      // Always start in Research mode
      setMode(false);

      // Toggle switch changes mode
      if (toggle) {
        toggle.addEventListener('change', function () {
          setMode(toggle.checked);
        });
      }

      // Life tab navigation
      if (lifeNav) {
        lifeNav.addEventListener('click', function (e) {
          var link = e.target.closest('a');
          if (!link) return;
          var href = link.getAttribute('href');
          if (href === '/') {
            setMode(false);
            e.preventDefault();
          } else if (href && href.startsWith('#')) {
            e.preventDefault();
            showLifeTab(href.substring(1));
          }
        });
      }

      // Travel year counter controls
      var travelCounter = document.querySelector('[data-travel-counter]');
      if (travelCounter) {
        var yearPanels = Array.prototype.slice.call(travelCounter.querySelectorAll('[data-travel-year-panel]'));
        var activeYearIndex = 0;
        var counterIsAnimating = false;
        var reduceCounterMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function closePhotoNotes(panel) {
          if (!panel) return;
          panel.classList.remove('is-previewing');
          var trigger = panel.querySelector('[data-travel-year-trigger]');
          var moments = panel.querySelector('[data-travel-moments]');
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
          if (moments) moments.setAttribute('aria-hidden', 'true');
        }

        function showTravelYear(index, animate) {
          index = Math.max(0, Math.min(yearPanels.length - 1, index));
          if (counterIsAnimating || (animate && index === activeYearIndex)) return;

          var outgoingPanel = yearPanels[activeYearIndex];
          var incomingPanel = yearPanels[index];
          var direction = index > activeYearIndex ? 'older' : 'newer';

          yearPanels.forEach(closePhotoNotes);

          if (!animate || reduceCounterMotion) {
            yearPanels.forEach(function (panel, panelIndex) {
              panel.hidden = panelIndex !== index;
            });
            activeYearIndex = index;
            return;
          }

          counterIsAnimating = true;
          incomingPanel.hidden = false;
          outgoingPanel.classList.add('is-counter-leaving', 'is-counter-leaving--' + direction);
          incomingPanel.classList.add('is-counter-entering', 'is-counter-entering--' + direction);
          activeYearIndex = index;

          window.setTimeout(function () {
            outgoingPanel.hidden = true;
            outgoingPanel.classList.remove('is-counter-leaving', 'is-counter-leaving--' + direction);
            incomingPanel.classList.remove('is-counter-entering', 'is-counter-entering--' + direction);
            counterIsAnimating = false;
          }, 430);
        }

        travelCounter.addEventListener('click', function (e) {
          var arrow = e.target.closest('[data-travel-step]');
          if (!arrow || arrow.disabled) return;
          showTravelYear(activeYearIndex + Number(arrow.getAttribute('data-travel-step')), true);
        });

        yearPanels.forEach(function (panel) {
          var trigger = panel.querySelector('[data-travel-year-trigger]');
          var moments = panel.querySelector('[data-travel-moments]');
          if (!trigger || !moments) return;

          function openPhotoNotes() {
            panel.classList.add('is-previewing');
            trigger.setAttribute('aria-expanded', 'true');
            moments.setAttribute('aria-hidden', 'false');
          }

          trigger.addEventListener('click', function () {
            if (panel.classList.contains('is-previewing')) {
              closePhotoNotes(panel);
            } else {
              openPhotoNotes();
            }
          });
          panel.addEventListener('mouseleave', function () {
            closePhotoNotes(panel);
          });
        });

        showTravelYear(0, false);
      }

      // Home link resets to Research
      document.addEventListener('click', function (e) {
        var link = e.target.closest('a');
        if (link && link.getAttribute('href') === '/') {
          setMode(false);
        }
      });
    })();
  </script>

<!-- end custom footer snippets -->
