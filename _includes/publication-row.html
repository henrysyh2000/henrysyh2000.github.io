{% assign paper = include.paper %}
<article class="home-paper">
  <a class="home-paper__link" href="{{ paper.arxiv | escape }}">
    <div class="home-paper__figure">
      <img src="{{ paper.image | relative_url }}" alt="{{ paper.image_alt | escape }}" width="600" height="400" loading="lazy" decoding="async">
    </div>
    <div class="home-paper__text">
      {% if include.heading == 'h2' %}
        <h2>{{ paper.title | escape }}</h2>
      {% else %}
        <h3>{{ paper.title | escape }}</h3>
      {% endif %}
      <p>{{ paper.venue | escape }}</p>
    </div>
    <span class="home-paper__read" aria-hidden="true">Paper <svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M4 12 12 4M4 4h8v8" stroke="currentColor" stroke-width="1.3"/></svg></span>
  </a>
</article>
